name: Documentation

on:
  push:
  pull_request:

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sphinx-build -W --keep-going -b html . build/html
      - run: sphinx-build -W --keep-going -b linkcheck . build/linkcheck
      - name: Check documentation policy
        shell: bash
        run: |
          test -f bootlog.png
          ! grep -RInP '[\x{4e00}-\x{9fff}]' --include='*.md' .
          ! grep -RInE '/home/[^/]+|[[:xdigit:]]{2}(:[[:xdigit:]]{2}){5}' --include='*.md' .
